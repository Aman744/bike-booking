version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bike_booking_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bike_booking_net

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-prod
    container_name: bike_booking_server
    ports:
      - "5000:5000"
    environment:
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-1d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-7d}
      - NODE_ENV=${NODE_ENV:-production}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@lykanrides.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-ChangeMe@123}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
    networks:
      - bike_booking_net

  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-prod
    container_name: bike_booking_client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - bike_booking_net

volumes:
  mongo_data:

networks:
  bike_booking_net:
    driver: bridge
